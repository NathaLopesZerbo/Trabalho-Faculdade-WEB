version: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema_produtos_app
    restart: unless-stopped
    working_dir: /var/www/
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: sistema_db
      DB_USER: sistema_user
      DB_PASS: sistema_pass
    networks:
      - appnet

  db:
    image: mysql:8.0
    container_name: sistema_produtos_db
    platform: linux/x86_64
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sistema_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sistema_pass}
      MYSQL_USER: ${DB_USERNAME:-sistema_user}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/sistema_db.sql:/docker-entrypoint-initdb.d/sistema_db.sql:ro
    ports:
      - "3300:3306"
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - appnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sistema_produtos_phpmyadmin
    platform: linux/x86_64
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    depends_on:
      - db
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  mysql_data:
